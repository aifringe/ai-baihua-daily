name: Update AI news

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '可选：历史回补起始日期（YYYY-MM-DD）'
        required: false
        type: string
      limit:
        description: '本批最多新增条数（上限20）'
        required: false
        default: '20'
        type: string
      until:
        description: '可选：历史回补结束日期（YYYY-MM-DD）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test update rules
        run: python3 -m unittest scripts/test_update_news.py
      - name: Build deduplicated edition from readable articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BACKFILL_SINCE: ${{ inputs.since }}
          BACKFILL_UNTIL: ${{ inputs.until }}
          UPDATE_LIMIT: ${{ inputs.limit || '20' }}
        run: |
          args=("$UPDATE_LIMIT")
          if [[ -n "$BACKFILL_SINCE" ]]; then args+=(--since "$BACKFILL_SINCE"); fi
          if [[ -n "$BACKFILL_UNTIL" ]]; then args+=(--until "$BACKFILL_UNTIL"); fi
          python3 scripts/update_news.py "${args[@]}"
      - name: Publish changed edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/news.json
          git diff --cached --quiet || git commit -m "Update deduplicated AI news"
          git push
          gh workflow run deploy-baota.yml
